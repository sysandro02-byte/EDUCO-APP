    <script>
      tailwind = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              educo: {
                navy: '#1F4A59',
                blue: '#42A5F5',
                darkbg: '#0F172A',
                darkcard: '#1E293B'
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
    /* Hide sidebar, header, and action buttons when printing */
    aside, header, .no-print {
      display: none !important;
    }
    /* Ensure the main content takes up the full width */
    .lg\:pl-64 {
      padding-left: 0 !important;
    }
    main {
      padding: 0 !important;
    }
    /* Ensure the background is white for printing */
    body, .bg-white {
      background-color: white !important;
    }
    /* Remove shadows and borders that are not needed for print */
    .shadow-lg, .shadow-md, .border {
      box-shadow: none !important;
      border: none !important;
    }
     /* Specific styles for printing the ID Card modal */
    body.print-id-card .modal-print-area {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    body.print-id-card > *:not(.modal-print-area) {
      display: none;
    }
  }
</style>
<link rel="stylesheet" href="/index.css">
