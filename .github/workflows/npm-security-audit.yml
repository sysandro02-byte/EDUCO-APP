name: NPM Security Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile metadata safely
        run: npm install --package-lock-only --ignore-scripts --audit=false
      - name: Apply compatible security fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Show lockfile changes
        run: git diff -- package-lock.json
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --audit=false
      - name: Build EDUCO
        run: npm run build
      - name: Persist repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: synchronize npm lockfile"
          git push
      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
