name: NPM Security Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile metadata safely
        run: npm install --package-lock-only --ignore-scripts --audit=false
      - name: Verify lockfile matches package.json
        run: git diff --exit-code -- package-lock.json || (echo 'package-lock.json is stale; regenerated diff shown above' && exit 1)
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
