name: NPM Security Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile metadata safely
        run: npm install --package-lock-only --ignore-scripts --audit=false
      - name: Report lockfile drift
        run: git diff -- package-lock.json
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
