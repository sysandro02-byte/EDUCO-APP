name: Student Enrollment Security

on:
  pull_request:
    paths:
      - 'server/studentEnrollment.ts'
      - 'server/operations.ts'
      - 'server/operationsLegacy.ts'
      - 'src/services/api.ts'
      - 'src/services/apiLegacy.ts'
      - 'src/services/studentApi.ts'
      - 'supabase/migrations/20260917_student_enrollment_integrity.sql'
      - 'tests/student-enrollment.test.ts'
      - '.github/workflows/student-enrollment-security.yml'
  push:
    branches: [main]
    paths:
      - 'server/studentEnrollment.ts'
      - 'server/operations.ts'
      - 'server/operationsLegacy.ts'
      - 'src/services/api.ts'
      - 'src/services/apiLegacy.ts'
      - 'src/services/studentApi.ts'
      - 'supabase/migrations/20260917_student_enrollment_integrity.sql'
      - 'tests/student-enrollment.test.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/student-enrollment.test.ts tests/user-account-workflow.test.ts
      - run: npm run build
