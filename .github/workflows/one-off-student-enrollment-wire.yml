name: One-off Student Enrollment Wire

on:
  push:
    branches:
      - fix/student-enrollment-finalization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-enrollment-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire enrollment route and client
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'server/operations.ts',
              "import { registerAccountLifecycle } from './accountLifecycle.ts';\n",
              "import { registerAccountLifecycle } from './accountLifecycle.ts';\nimport { registerStudentEnrollment } from './studentEnrollment.ts';\n"
          )
          replace(
              'server/operations.ts',
              "  registerAccountLifecycle(app, requireAuth, getUser, getClient);\n  app.post('/api/records/:table/delete'",
              "  registerAccountLifecycle(app, requireAuth, getUser, getClient);\n  registerStudentEnrollment(app, requireAuth, getUser, getClient);\n  app.post('/api/records/:table/delete'"
          )

          replace(
              'src/services/api.ts',
              "    const headers = await getAuthHeaders();\n    const res = await fetch(getApiUrl('/api/users'), {\n      method: 'POST',\n      headers,\n      body: JSON.stringify(user),\n    });",
              "    const headers = await getAuthHeaders();\n    const normalizedRole = String(user?.role || '').trim().toLowerCase();\n    const isNewStudent = user?.id == null && ['élève', 'eleve', 'student'].includes(normalizedRole);\n    const endpoint = isNewStudent ? '/api/enrollments/students' : '/api/users';\n    const payload = isNewStudent ? { ...user, phone: user?.phone || user?.contact || null } : user;\n    const res = await fetch(getApiUrl(endpoint), {\n      method: 'POST',\n      headers,\n      body: JSON.stringify(payload),\n    });"
          )
          PY
      - name: Validate student enrollment
        run: |
          npm ci
          npx tsx --test tests/student-enrollment.test.ts
          npm run build
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/operations.ts src/services/api.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: route new students through atomic enrollment"
          git push origin HEAD:fix/student-enrollment-finalization
