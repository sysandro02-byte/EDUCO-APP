name: Grades and Bulletins Security

on:
  pull_request:
    paths:
      - 'server/gradeGuard.ts'
      - 'server/studentEnrollment.ts'
      - 'server.ts'
      - 'components/TeacherGradesPage.tsx'
      - 'components/GradeForm.tsx'
      - 'components/Bulletin.tsx'
      - 'components/ReportCardCommentsForm.tsx'
      - 'tests/grades-bulletins.test.ts'
      - '.github/workflows/grades-bulletins-security.yml'
  push:
    branches: [main]
    paths:
      - 'server/gradeGuard.ts'
      - 'server/studentEnrollment.ts'
      - 'server.ts'
      - 'components/TeacherGradesPage.tsx'
      - 'components/GradeForm.tsx'
      - 'components/Bulletin.tsx'
      - 'components/ReportCardCommentsForm.tsx'
      - 'tests/grades-bulletins.test.ts'
      - '.github/workflows/grades-bulletins-security.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/grades-bulletins.test.ts
      - run: npm run build
