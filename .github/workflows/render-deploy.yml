name: Deploy EDUCO to Render

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    steps:
      - name: Start deployment of the latest main commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-da0drvdg1s2s73ctn9r0
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'
