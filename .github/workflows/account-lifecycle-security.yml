name: Account Lifecycle Security
on:
  pull_request:
    paths:
      - 'server/accountLifecycle.ts'
      - 'supabase/migrations/20260916_account_lifecycle.sql'
      - 'tests/account-lifecycle.test.ts'
      - '.github/workflows/account-lifecycle-security.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx --test tests/account-lifecycle.test.ts
      - run: npm run build
